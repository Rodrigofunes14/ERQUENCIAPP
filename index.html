    // --- PAD DE FIRMA DIGITAL TÁCTIL ---
    const PadFirmaDigital = ({ onGuardarFirma, firmaExistente }) => {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [hasStrokes, setHasStrokes] = useState(false);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const resizeCanvas = () => {
          const rect = canvas.parentElement.getBoundingClientRect();
          canvas.width = rect.width;
          canvas.height = 180;
          const ctx = canvas.getContext('2d');
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#1B4D7E';
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        return () => window.removeEventListener('resize', resizeCanvas);
      }, []);

      const getCoordinates = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        }
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      };

      const startDrawing = (e) => {
        e.preventDefault();
        const { x, y } = getCoordinates(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.beginPath();
        ctx.moveTo(x, y);
        setIsDrawing(true);
        setHasStrokes(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        const { x, y } = getCoordinates(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.lineTo(x, y);
        ctx.stroke();
      };

      const stopDrawing = () => setIsDrawing(false);

      const limpiarFirma = () => {
        const canvas = canvasRef.current;
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        setHasStrokes(false);
      };

      const confirmarFirma = () => {
        if (!hasStrokes) return;
        onGuardarFirma(canvasRef.current.toDataURL('image/png'));
      };

      if (firmaExistente) {
        return (
          <div className="bg-[#E6F4F1] border border-[#34B37B]/40 rounded-xl p-4 text-center">
            <div className="flex items-center justify-center gap-2 text-[#1B6B48] font-semibold mb-2">
              <Icon name="check-circle-2" className="w-5 h-5 text-[#34B37B]" />
              <span>Conformidad de Traslado Firmada</span>
            </div>
            <div className="bg-white border border-[#34B37B]/20 rounded-lg p-2 inline-block shadow-sm">
              <img src={firmaExistente} alt="Firma del paciente" className="h-24 object-contain" />
            </div>
          </div>
        );
      }

      return (
        <div className="bg-[#F2F7FA] border-2 border-dashed border-[#288296]/40 rounded-2xl p-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-sm font-semibold text-[#1B4D7E] flex items-center gap-1.5">
              <Icon name="file-signature" className="w-4 h-4 text-[#34B37B]" />
              Firma del Paciente o Acompañante (Con el dedo)
            </span>
            <span className="text-xs text-[#288296] font-medium">Conformidad ART</span>
          </div>

          <div className="w-full bg-white rounded-xl border border-slate-200 overflow-hidden touch-none shadow-inner">
            <canvas
              ref={canvasRef}
              onMouseDown={startDrawing}
              onMouseMove={draw}
              onMouseUp={stopDrawing}
              onMouseLeave={stopDrawing}
              onTouchStart={startDrawing}
              onTouchMove={draw}
              onTouchEnd={stopDrawing}
              className="w-full h-[180px] cursor-crosshair block"
            />
          </div>

          <div className="flex flex-wrap items-center justify-end gap-2 mt-3">
            <button type="button" onClick={limpiarFirma} className="px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-xl hover:bg-slate-100 flex items-center gap-1.5 transition">
              <Icon name="rotate-ccw" className="w-4 h-4" /> Limpiar
            </button>
            <button
              type="button"
              disabled={!hasStrokes}
              onClick={confirmarFirma}
              style={hasStrokes ? { background: 'linear-gradient(135deg, #34B37B 0%, #1E588D 100%)' } : {}}
              className={`px-5 py-2 text-sm font-semibold text-white rounded-xl flex items-center gap-1.5 shadow-sm transition ${
                hasStrokes ? 'hover:opacity-95 cursor-pointer' : 'bg-slate-300 cursor-not-allowed'
              }`}
            >
              <Icon name="save" className="w-4 h-4" /> Guardar Firma y Finalizar Viaje
            </button>
          </div>
        </div>
      );
    };

    // --- APLICACIÓN PRINCIPAL ---

      const [rolActivo, setRolActivo] = useState('EMPLEADOR');
      const [traslados, setTraslados] = useState([]);
      const [viajeSeleccionadoId, setViajeSeleccionadoId] = useState(null);
      const [cargando, setCargando] = useState(true);
      const [notificacion, setNotificacion] = useState(null);
      const [simulandoGPS, setSimulandoGPS] = useState(false);
      const [mostrarFormNuevo, setMostrarFormNuevo] = useState(false);

      const [nuevoTraslado, setNuevoTraslado] = useState({
        pacienteNombre: '',
        pacienteDni: '',
        pacienteTelefono: '',
        aseguradoraArt: ASEGURADORAS_ART[0],
        numeroSiniestro: '',
        origenDireccion: '',
        destinoNombre: CENTROS_MEDICOS_SR[0].nombre,
        fecha: new Date().toISOString().split('T')[0],
        hora: '10:30',
        movilidad: TIPOS_MOVILIDAD[0],
        choferId: CHOFERES_DISPONIBLES[0].id,
        vehiculoId: VEHICULOS_DISPONIBLES[0].id,
        observaciones: ''
      });

      const mostrarToast = (mensaje, tipo = 'success') => {
        setNotificacion({ mensaje, tipo });
        setTimeout(() => setNotificacion(null), 4000);
      };

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (!auth) return;
            await signInAnonymously(auth);
          } catch (err) {
            setUser({ uid: 'local-user-erquenci' });
          }
        };
        initAuth();
        if (!auth) {
          setUser({ uid: 'local-user-erquenci' });
          return;
        }
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser || { uid: 'local-user-erquenci' });
        }, () => {
          setUser({ uid: 'local-user-erquenci' });
        });
        return () => unsubscribe && unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const datosDemoIniciales = [
          {
            id: 'demo-1',
            pacienteNombre: 'Juan Carlos Pereyra',
            pacienteDni: '28.451.902',
            pacienteTelefono: '+54 9 260 458-1120',
            aseguradoraArt: 'Prevención ART',
            numeroSiniestro: 'ART-992841',
            origenDireccion: 'Av. Hipólito Yrigoyen 1420, San Rafael',
            origenCoords: { x: 22, y: 52 },
            destinoNombre: 'Policlínica Privada San Rafael (Av. Mitre 154)',
            destinoCoords: { x: 68, y: 34 },
            fecha: new Date().toISOString().split('T')[0],
            hora: '11:30',
            movilidad: 'Silla de Ruedas / Muletas',
            estado: 'EN_CAMINO_DOMICILIO',
            progreso: 28,
            etaMinutos: 7,
            choferId: 'ch-1',
            choferNombre: 'Carlos Mendoza',
            choferTelefono: '+54 9 260 451-2890',
            choferFoto: 'CM',
            vehiculoId: 'vh-1',
            vehiculoModelo: 'Renault Kangoo Express Adaptada',
            vehiculoPatente: 'AF 842 KL',
            observaciones: 'Paciente con bota ortopédica en pierna derecha.',
            firmaUrl: null,
            creadoEn: Date.now()
          }
        ];

        if (!db) {
          setTraslados(datosDemoIniciales);
          setViajeSeleccionadoId('demo-1');
          setCargando(false);
          return;
        }

        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'traslados_erquenci');
        const inicializarDatosDemo = async () => {
          try {
            const snapshot = await getDocs(colRef);
            if (snapshot.empty) {
              for (const d of datosDemoIniciales) {
                const { id, ...resto } = d;
                await addDoc(colRef, resto);
              }
            }
          } catch (e) {
            setTraslados(datosDemoIniciales);
            setViajeSeleccionadoId('demo-1');
            setCargando(false);
          }
        };
        inicializarDatosDemo();

        const unsubscribe = onSnapshot(colRef, (snapshot) => {
          const lista = snapshot.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() }));
          if (lista.length > 0) {
            lista.sort((a, b) => (b.creadoEn || 0) - (a.creadoEn || 0));
            setTraslados(lista);
            if (!viajeSeleccionadoId) setViajeSeleccionadoId(lista[0].id);
          } else {
            setTraslados(datosDemoIniciales);
          }
          setCargando(false);
        }, () => {
          setTraslados(datosDemoIniciales);
          if (!viajeSeleccionadoId) setViajeSeleccionadoId('demo-1');
          setCargando(false);
        });

        return () => unsubscribe && unsubscribe();
      }, [user]);

      const viajeActivo = traslados.find((t) => t.id === viajeSeleccionadoId) || traslados[0] || null;

      useEffect(() => {
        if (!simulandoGPS || !viajeActivo || !user) return;
        const interval = setInterval(async () => {
          const progActual = viajeActivo.progreso || 0;
          if (db) {
            try {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'traslados_erquenci', viajeActivo.id);
              if (viajeActivo.estado === 'EN_CAMINO_DOMICILIO') {
                if (progActual < 45) {
                  const nuevoProg = Math.min(45, progActual + 5);
                  await updateDoc(docRef, { progreso: nuevoProg, etaMinutos: Math.max(1, Math.round((45 - nuevoProg) / 5)) });
                } else {
                  await updateDoc(docRef, { estado: 'EN_DOMICILIO', progreso: 45, etaMinutos: 0 });
                  setSimulandoGPS(false);
                  mostrarToast('¡La unidad llegó al domicilio del paciente!');
                }
              } else if (viajeActivo.estado === 'PACIENTE_A_BORDO') {
                if (progActual < 95) {
                  const nuevoProg = Math.min(95, progActual + 5);
                  await updateDoc(docRef, { progreso: nuevoProg, etaMinutos: Math.max(1, Math.round((95 - nuevoProg) / 5)) });
                } else {
                  setSimulandoGPS(false);
                  mostrarToast('Llegada al centro médico. Solicite la firma del paciente.');
                }
              } else {
                setSimulandoGPS(false);
              }
            } catch (e) {
              setTraslados((prev) => prev.map((t) => (t.id === viajeActivo.id ? { ...t, progreso: Math.min(95, progActual + 5) } : t)));
            }
          }
        }, 1200);
        return () => clearInterval(interval);
      }, [simulandoGPS, viajeActivo, user]);

      const handleCrearTraslado = async (e) => {
        e.preventDefault();
        const chofer = CHOFERES_DISPONIBLES.find((c) => c.id === nuevoTraslado.choferId);
        const vehiculo = VEHICULOS_DISPONIBLES.find((v) => v.id === nuevoTraslado.vehiculoId);
        const centro = CENTROS_MEDICOS_SR.find((cm) => cm.nombre === nuevoTraslado.destinoNombre) || CENTROS_MEDICOS_SR[0];

        const payload = {
          pacienteNombre: nuevoTraslado.pacienteNombre,
          pacienteDni: nuevoTraslado.pacienteDni,
          pacienteTelefono: nuevoTraslado.pacienteTelefono || '+54 9 260 400-0000',
          aseguradoraArt: nuevoTraslado.aseguradoraArt,
          numeroSiniestro: nuevoTraslado.numeroSiniestro || `SIN-${Math.floor(10000 + Math.random() * 90000)}`,
          origenDireccion: nuevoTraslado.origenDireccion,
          origenCoords: { x: Math.floor(15 + Math.random() * 32), y: Math.floor(35 + Math.random() * 40) },
          destinoNombre: centro.nombre,
          destinoCoords: centro.coords,
          fecha: nuevoTraslado.fecha,
          hora: nuevoTraslado.hora,
          movilidad: nuevoTraslado.movilidad,
          estado: chofer && vehiculo ? 'ASIGNADO' : 'PENDIENTE',
          progreso: chofer && vehiculo ? 5 : 0,
          etaMinutos: 15,
          choferId: chofer ? chofer.id : '',
          choferNombre: chofer ? chofer.nombre : '',
          choferTelefono: chofer ? chofer.telefono : '',
          choferFoto: chofer ? chofer.foto : '',
          vehiculoId: vehiculo ? vehiculo.id : '',
          vehiculoModelo: vehiculo ? vehiculo.modelo : '',
          vehiculoPatente: vehiculo ? vehiculo.patente : '',
          observaciones: nuevoTraslado.observaciones,
          firmaUrl: null,
          creadoEn: Date.now()
        };

        try {
          if (db) {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'traslados_erquenci');
            const docCreated = await addDoc(colRef, payload);
            setViajeSeleccionadoId(docCreated.id);
          } else {
            const newId = 'local-' + Date.now();
            setTraslados((prev) => [{ id: newId, ...payload }, ...prev]);
            setViajeSeleccionadoId(newId);
          }
          setMostrarFormNuevo(false);
          setNuevoTraslado({ ...nuevoTraslado, pacienteNombre: '', pacienteDni: '', pacienteTelefono: '', numeroSiniestro: '', origenDireccion: '', observaciones: '' });
          mostrarToast('Traslado agendado y unidad asignada correctamente.');
        } catch (err) {
          mostrarToast('Traslado guardado localmente.');
        }
      };

      const handleReasignarUnidad = async (trasladoId, nuevoChoferId, nuevoVehiculoId) => {
        const chofer = CHOFERES_DISPONIBLES.find((c) => c.id === nuevoChoferId);
        const vehiculo = VEHICULOS_DISPONIBLES.find((v) => v.id === nuevoVehiculoId);
        if (!chofer || !vehiculo) return;
        const cambios = {
          choferId: chofer.id, choferNombre: chofer.nombre, choferTelefono: chofer.telefono, choferFoto: chofer.foto,
          vehiculoId: vehiculo.id, vehiculoModelo: vehiculo.modelo, vehiculoPatente: vehiculo.patente, estado: 'ASIGNADO', progreso: 5
        };
        if (db) {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'traslados_erquenci', trasladoId), cambios);
        } else {
          setTraslados((prev) => prev.map((t) => (t.id === trasladoId ? { ...t, ...cambios } : t)));
        }
        mostrarToast(`Unidad actualizada: ${chofer.nombre} (${vehiculo.patente})`);
      };

      const handleCambiarEstadoChofer = async (nuevoEstado) => {
        if (!viajeActivo) return;
        setSimulandoGPS(false);
        const infoEstado = ESTADOS_VIAJE[nuevoEstado];
        const nuevoEta = nuevoEstado === 'EN_CAMINO_DOMICILIO' ? 9 : nuevoEstado === 'PACIENTE_A_BORDO' ? 12 : 0;
        const cambios = { estado: nuevoEstado, progreso: infoEstado.progreso, etaMinutos: nuevoEta };
        if (db) {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'traslados_erquenci', viajeActivo.id), cambios);
        } else {
          setTraslados((prev) => prev.map((t) => (t.id === viajeActivo.id ? { ...t, ...cambios } : t)));
        }
        mostrarToast(`Estado actualizado: ${infoEstado.label}`);
      };

      const handleGuardarFirmaDigital = async (firmaDataUrl) => {
        if (!viajeActivo) return;
        const horaFin = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        const cambios = { firmaUrl: firmaDataUrl, estado: 'FINALIZADO', progreso: 100, etaMinutos: 0, horaFinalizacion: horaFin };
        if (db) {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'traslados_erquenci', viajeActivo.id), cambios);
        } else {
          setTraslados((prev) => prev.map((t) => (t.id === viajeActivo.id ? { ...t, ...cambios } : t)));
        }
        mostrarToast('¡Firma guardada! Traslado ART finalizado con éxito.');
      };

      return (
        <div className="min-h-screen text-slate-800 font-sans flex flex-col relative">
          <FondoOndasErquenci />

          {notificacion && (
            <div className="fixed bottom-5 right-5 z-50 animate-bounce">
              <div className="px-4 py-3 rounded-xl shadow-xl border flex items-center gap-2.5 text-sm font-medium bg-[#123658] text-white border-[#34B37B]/50">
                <Icon name="check-circle-2" className="w-5 h-5 text-[#4AC48E]" />
                <span>{notificacion.mensaje}</span>
              </div>
            </div>
          )}

          <header className="bg-white/90 backdrop-blur-md border-b border-[#288296]/20 sticky top-0 z-40 shadow-sm">
            <div className="text-white text-[11px] font-semibold tracking-wider text-center py-1 px-4" style={{ background: 'linear-gradient(90deg, #34B37B 0%, #268295 50%, #1B4D7E 100%)' }}>
              TRASLADOS AMBULATORIOS PROFESIONALES Y SEGUROS • SAN RAFAEL, MENDOZA • COBERTURA INTEGRAL 24/7
            </div>

            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
              <LogoErquenci size="md" showTagline={true} />

              <div className="flex items-center bg-[#EBF3F7] p-1 rounded-xl border border-[#288296]/20 w-full md:w-auto overflow-x-auto">
                <button
                  onClick={() => setRolActivo('EMPLEADOR')}
                  className={`flex-1 md:flex-none px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition whitespace-nowrap ${
                    rolActivo === 'EMPLEADOR' ? 'bg-white text-[#1B4D7E] shadow-sm border border-[#34B37B]/30' : 'text-slate-600 hover:text-[#1B4D7E]'
                  }`}
                >
                  <Icon name="shield-check" className="w-4 h-4 text-[#34B37B]" />
                  <span>1. Empleador</span>
                </button>

                <button
                  onClick={() => setRolActivo('CHOFER')}
                  className={`flex-1 md:flex-none px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition whitespace-nowrap ${
                    rolActivo === 'CHOFER' ? 'bg-white text-[#1B4D7E] shadow-sm border border-[#34B37B]/30' : 'text-slate-600 hover:text-[#1B4D7E]'
                  }`}
                >
                  <Icon name="car" className="w-4 h-4 text-[#23649E]" />
                  <span>2. App Chofer</span>
                </button>

                <button
                  onClick={() => setRolActivo('PACIENTE')}
                  className={`flex-1 md:flex-none px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition whitespace-nowrap ${
                    rolActivo === 'PACIENTE' ? 'bg-white text-[#1B6B48] shadow-sm border border-[#34B37B]/30' : 'text-slate-600 hover:text-[#1B6B48]'
                  }`}
                >
                  <Icon name="navigation" className="w-4 h-4 text-[#34B37B]" />
                  <span>3. Paciente / ART</span>
                </button>
              </div>
            </div>
          </header>

          {traslados.length > 0 && (
            <div className="bg-[#123658] text-slate-100 border-b border-[#288296]/30 relative z-30">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 py-2 flex flex-wrap items-center justify-between gap-2 text-xs">
                <div className="flex items-center gap-2 overflow-x-auto py-1">
                  <span className="text-[#8EC5DF] font-medium whitespace-nowrap">Traslado activo:</span>
                  {traslados.map((t) => (
                    <button
                      key={t.id}
                      onClick={() => { setSimulandoGPS(false); setViajeSeleccionadoId(t.id); }}
                      style={viajeActivo?.id === t.id ? { background: 'linear-gradient(90deg, #34B37B 0%, #23649E 100%)' } : {}}
                      className={`px-3 py-1 rounded-full font-medium transition whitespace-nowrap flex items-center gap-1.5 ${
                        viajeActivo?.id === t.id ? 'text-white shadow border border-white/25' : 'bg-[#1B4D7E]/70 text-slate-200 hover:bg-[#23649E]'
                      }`}
                    >
                      <span>{t.pacienteNombre}</span>
                      <span className="opacity-80">({t.aseguradoraArt})</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 relative z-10">
            {cargando ? (
              <div className="flex flex-col items-center justify-center py-20 text-[#1B4D7E]">
                <div className="w-10 h-10 border-4 border-[#34B37B] border-t-[#1B4D7E] rounded-full animate-spin mb-3"></div>
                <p className="font-medium">Conectando con central operativa Erquenci...</p>
              </div>
            ) : (
              <>
                {rolActivo === 'EMPLEADOR' && (
                  <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                      <div>
                        <h2 className="text-2xl font-bold text-[#1B4D7E]">Panel de Despacho y Flota</h2>
                        <p className="text-sm text-slate-600">Agendá pacientes de ART, asigná choferes y auditá traslados ambulatorios en San Rafael.</p>
                      </div>
                      <button
                        onClick={() => setMostrarFormNuevo(!mostrarFormNuevo)}
                        style={{ background: 'linear-gradient(135deg, #34B37B 0%, #1E588D 100%)' }}
                        className="hover:opacity-95 text-white font-semibold px-5 py-2.5 rounded-xl shadow-md flex items-center justify-center gap-2 transition"
                      >
                        <Icon name="plus" className="w-5 h-5" />
                        <span>{mostrarFormNuevo ? 'Cerrar Formulario' : 'Agendar Nuevo Traslado ART'}</span>
                      </button>
                    </div>

                    {mostrarFormNuevo && (
                      <form onSubmit={handleCrearTraslado} className="bg-white/95 backdrop-blur-md rounded-2xl border border-[#34B37B]/40 shadow-xl p-6 space-y-5">
                        <div className="border-b border-slate-100 pb-3 flex items-center justify-between">
                          <h3 className="text-lg font-bold text-[#1B4D7E]">Nueva Orden de Traslado Ambulatorio ART</h3>
                          <span className="text-xs bg-[#E6F4F1] text-[#1B6B48] px-3 py-1 rounded-full font-semibold">San Rafael, Mendoza</span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo del Paciente *</label>
                            <input type="text" required placeholder="Ej: Roberto Gómez" value={nuevoTraslado.pacienteNombre} onChange={(e) => setNuevoTraslado({ ...nuevoTraslado, pacienteNombre: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm outline-none" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-600 mb-1">DNI del Paciente *</label>
                            <input type="text" required placeholder="Ej: 30.123.456" value={nuevoTraslado.pacienteDni} onChange={(e) => setNuevoTraslado({ ...nuevoTraslado, pacienteDni: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm outline-none" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-600 mb-1">Teléfono del Paciente</label>
                            <input type="text" placeholder="Ej: +54 9 260 455-1234" value={nuevoTraslado.pacienteTelefono} onChange={(e) => setNuevoTraslado({ ...nuevoTraslado, pacienteTelefono: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm outline-none" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-600 mb-1">Aseguradora ART *</label>
                            <select value={nuevoTraslado.aseguradoraArt} onChange={(e) => setNuevoTraslado({ ...nuevoTraslado, aseguradoraArt: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm bg-white outline-none">
                              {ASEGURADORAS_ART.map((art) => (<option key={art} value={art}>{art}</option>))}
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-600 mb-1">N° Siniestro / Autorización</label>
                            <input type="text" placeholder="Ej: ART-88210" value={nuevoTraslado.numeroSiniestro} onChange={(e) => setNuevoTraslado({ ...nuevoTraslado, numeroSiniestro: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm outline-none" />
                          </div>
                          <div className="grid grid-cols-2 gap-2">
                            <div>
                              <label className="block text-xs font-semibold text-slate-600 mb-1">Fecha *</label>
                              <input type="date" required value={nuevoTraslado.fecha} onChange={(e) => setNuevoTraslado({ ...nuevoTraslado, fecha: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm outline-none" />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-slate-600 mb-1">Hora *</label>
                              <input type="time" required value={nuevoTraslado.hora} onChange={(e) => setNuevoTraslado({ ...nuevoTraslado, hora: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm outline-none" />
                            </div>
                          </div>
                          <div className="md:col-span-2">
                            <label className="block text-xs font-semibold text-slate-600 mb-1">Domicilio de Origen (San Rafael) *</label>
                            <input type="text" required placeholder="Ej: Av. Balloffet 850, San Rafael" value={nuevoTraslado.origenDireccion} onChange={(e) => setNuevoTraslado({ ...nuevoTraslado, origenDireccion: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm outline-none" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-600 mb-1">Centro Médico / Rehabilitación *</label>
                            <select value={nuevoTraslado.destinoNombre} onChange={(e) => setNuevoTraslado({ ...nuevoTraslado, destinoNombre: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm bg-white outline-none">
                              {CENTROS_MEDICOS_SR.map((c) => (<option key={c.nombre} value={c.nombre}>{c.nombre}</option>))}
                            </select>
                          </div>
                          <div className="bg-[#E6F4F1]/70 p-3.5 rounded-xl border border-[#34B37B]/30">
                            <label className="block text-xs font-bold text-[#1B4D7E] mb-1">Asignar Chofer Erquenci</label>
                            <select value={nuevoTraslado.choferId} onChange={(e) => setNuevoTraslado({ ...nuevoTraslado, choferId: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-[#34B37B]/30 text-sm bg-white outline-none">
                              {CHOFERES_DISPONIBLES.map((ch) => (<option key={ch.id} value={ch.id}>{ch.nombre}</option>))}
                            </select>
                          </div>
                          <div className="bg-[#E6F4F1]/70 p-3.5 rounded-xl border border-[#34B37B]/30">
                            <label className="block text-xs font-bold text-[#1B4D7E] mb-1">Asignar Vehículo / Unidad</label>
                            <select value={nuevoTraslado.vehiculoId} onChange={(e) => setNuevoTraslado({ ...nuevoTraslado, vehiculoId: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-[#34B37B]/30 text-sm bg-white outline-none">
                              {VEHICULOS_DISPONIBLES.map((vh) => (<option key={vh.id} value={vh.id}>{vh.modelo} - [{vh.patente}]</option>))}
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-600 mb-1">Tipo de Movilidad</label>
                            <select value={nuevoTraslado.movilidad} onChange={(e) => setNuevoTraslado({ ...nuevoTraslado, movilidad: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm bg-white outline-none">
                              {TIPOS_MOVILIDAD.map((m) => (<option key={m} value={m}>{m}</option>))}
                            </select>
                          </div>
                        </div>

                        <div className="flex justify-end gap-3 pt-2">
                          <button type="button" onClick={() => setMostrarFormNuevo(false)} className="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl">Cancelar</button>
                          <button type="submit" style={{ background: 'linear-gradient(135deg, #34B37B 0%, #1E588D 100%)' }} className="hover:opacity-95 text-white font-semibold px-6 py-2 rounded-xl shadow-md">Confirmar y Despachar Unidad</button>
                        </div>
                      </form>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                      <div className="lg:col-span-2 space-y-4">
                        <h3 className="text-base font-bold text-[#1B4D7E]">Agenda de Traslados ART</h3>
                        {traslados.map((t) => {
                          const estadoObj = ESTADOS_VIAJE[t.estado] || ESTADOS_VIAJE.PENDIENTE;
                          const esSeleccionado = viajeActivo?.id === t.id;
                          return (
                            <div
                              key={t.id}
                              onClick={() => setViajeSeleccionadoId(t.id)}
                              className={`bg-white/95 backdrop-blur-sm rounded-2xl p-5 border transition cursor-pointer ${
                                esSeleccionado ? 'border-[#34B37B] ring-2 ring-[#34B37B]/25 shadow-md' : 'border-slate-200 hover:border-[#288296]/50 shadow-sm'
                              }`}
                            >
                              <div className="flex flex-wrap items-start justify-between gap-2 mb-3">
                                <div>
                                  <div className="flex items-center gap-2">
                                    <span className="font-bold text-base text-[#1B4D7E]">{t.pacienteNombre}</span>
                                    <span className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-mono">DNI {t.pacienteDni}</span>
                                  </div>
                                  <div className="text-xs font-semibold text-[#34B37B] mt-0.5">{t.aseguradoraArt} • Siniestro: {t.numeroSiniestro}</div>
                                </div>
                                <span className={`text-xs font-bold px-3 py-1 rounded-full border ${estadoObj.color}`}>{estadoObj.label}</span>
                              </div>

                              <div className="space-y-1.5 text-sm text-slate-600 bg-[#F2F7FA] p-3 rounded-xl border border-slate-100 mb-3">
                                <div className="flex items-start gap-2">
                                  <Icon name="map-pin" className="w-4 h-4 text-[#34B37B] mt-0.5" />
                                  <span><strong className="text-[#1B4D7E]">Origen:</strong> {t.origenDireccion}</span>
                                </div>
                                <div className="flex items-start gap-2">
                                  <Icon name="building-2" className="w-4 h-4 text-[#23649E] mt-0.5" />
                                  <span><strong className="text-[#1B4D7E]">Destino:</strong> {t.destinoNombre}</span>
                                </div>
                              </div>

                              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2 border-t border-slate-100 text-xs">
                                <div className="flex flex-wrap items-center gap-2">
                                  <span className="font-semibold text-slate-500">Chofer:</span>
                                  <select value={t.choferId} onClick={(e) => e.stopPropagation()} onChange={(e) => handleReasignarUnidad(t.id, e.target.value, t.vehiculoId)} className="bg-slate-100 border border-slate-200 rounded-lg px-2 py-1 font-medium text-slate-800">
                                    {CHOFERES_DISPONIBLES.map((c) => (<option key={c.id} value={c.id}>{c.nombre}</option>))}
                                  </select>
                                  <span className="font-semibold text-slate-500">Móvil:</span>
                                  <select value={t.vehiculoId} onClick={(e) => e.stopPropagation()} onChange={(e) => handleReasignarUnidad(t.id, t.choferId, e.target.value)} className="bg-slate-100 border border-slate-200 rounded-lg px-2 py-1 font-medium text-slate-800">
                                    {VEHICULOS_DISPONIBLES.map((v) => (<option key={v.id} value={v.id}>{v.patente}</option>))}
                                  </select>
                                </div>

                                <div className="flex items-center gap-2">
                                  {t.firmaUrl && (
                                    <span className="text-[#1B6B48] bg-[#E6F4F1] border border-[#34B37B]/30 px-2 py-1 rounded-lg font-semibold flex items-center gap-1">
                                      <Icon name="file-signature" className="w-3.5 h-3.5 text-[#34B37B]" /> Firmado
                                    </span>
                                  )}
                                  <span className="text-slate-400 flex items-center gap-1"><Icon name="clock" className="w-3.5 h-3.5" /> {t.hora} hs</span>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      <div className="space-y-4">
                        <h3 className="text-base font-bold text-[#1B4D7E]">Monitoreo Satelital en Vivo</h3>
                        {viajeActivo && (
                          <div className="bg-white/95 backdrop-blur-sm rounded-2xl border border-[#288296]/25 p-4 shadow-sm space-y-4">
                            <MapaSanRafael viaje={viajeActivo} isSimulating={simulandoGPS} />
                            {viajeActivo.firmaUrl && (
                              <div className="border-t border-slate-100 pt-3">
                                <span className="text-xs font-bold text-[#1B4D7E] block mb-2">Comprobante Digital Auditado ({viajeActivo.aseguradoraArt}):</span>
                                <div className="bg-[#F2F7FA] border border-[#34B37B]/30 rounded-xl p-3 flex flex-col items-center">
                                  <img src={viajeActivo.firmaUrl} alt="Firma conformidad" className="h-20 object-contain" />
                                  <span className="text-[11px] text-slate-500 mt-1">Firmado por {viajeActivo.pacienteNombre}</span>
                                </div>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {rolActivo === 'CHOFER' && viajeActivo && (
                  <div className="max-w-3xl mx-auto space-y-5">
                    <div className="text-white rounded-2xl p-5 shadow-lg flex flex-col sm:flex-row sm:items-center justify-between gap-4" style={{ background: 'linear-gradient(135deg, #1B4D7E 0%, #24788F 60%, #34B37B 100%)' }}>
                      <div className="flex items-center gap-3.5">
                        <div className="w-12 h-12 rounded-full bg-white/15 flex items-center justify-center font-bold text-lg border-2 border-white/60">
                          {viajeActivo.choferFoto || 'CH'}
                        </div>
                        <div>
                          <span className="text-xs text-[#A7F3D0] font-semibold uppercase tracking-wider">Móvil Operativo Erquenci</span>
                          <h2 className="text-lg font-bold">{viajeActivo.choferNombre}</h2>
                          <p className="text-xs text-slate-100">{viajeActivo.vehiculoModelo} • Patente <span className="font-mono bg-black/25 px-1.5 py-0.5 rounded">{viajeActivo.vehiculoPatente}</span></p>
                        </div>
                      </div>
                      {(viajeActivo.estado === 'EN_CAMINO_DOMICILIO' || viajeActivo.estado === 'PACIENTE_A_BORDO') && (
                        <button onClick={() => setSimulandoGPS(!simulandoGPS)} className="px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 bg-white text-[#1B4D7E] shadow">
                          <Icon name="play" className="w-4 h-4 text-[#34B37B]" /> {simulandoGPS ? 'Simulando Avance...' : 'Simular Recorrido GPS'}
                        </button>
                      )}
                    </div>

                    <MapaSanRafael viaje={viajeActivo} isSimulating={simulandoGPS} />

                    <div className="bg-white/95 backdrop-blur-sm rounded-2xl border border-[#288296]/25 p-5 shadow-sm space-y-4">
                      <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
                        <div>
                          <span className="text-xs font-bold text-[#34B37B] uppercase">{viajeActivo.aseguradoraArt}</span>
                          <h3 className="text-xl font-bold text-[#1B4D7E]">{viajeActivo.pacienteNombre}</h3>
                          <p className="text-xs text-slate-500">DNI: {viajeActivo.pacienteDni} • Turno: {viajeActivo.hora} hs</p>
                        </div>
                        <a href={`tel:${viajeActivo.pacienteTelefono}`} className="bg-[#E6F4F1] text-[#1B4D7E] px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5">
                          <Icon name="phone" className="w-4 h-4 text-[#34B37B]" /> Llamar Paciente
                        </a>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <button onClick={() => handleCambiarEstadoChofer('EN_CAMINO_DOMICILIO')} className={`p-3 rounded-xl text-sm font-bold border text-left flex items-center justify-between ${viajeActivo.estado === 'EN_CAMINO_DOMICILIO' ? 'bg-[#23649E] text-white' : 'bg-white text-slate-700 border-slate-300'}`}>
                          <span>1. En camino al domicilio</span> <Icon name="chevron-right" className="w-4 h-4" />
                        </button>
                        <button onClick={() => handleCambiarEstadoChofer('EN_DOMICILIO')} className={`p-3 rounded-xl text-sm font-bold border text-left flex items-center justify-between ${viajeActivo.estado === 'EN_DOMICILIO' ? 'bg-[#288296] text-white' : 'bg-white text-slate-700 border-slate-300'}`}>
                          <span>2. En puerta / Esperando paciente</span> <Icon name="chevron-right" className="w-4 h-4" />
                        </button>
                        <button onClick={() => handleCambiarEstadoChofer('PACIENTE_A_BORDO')} className={`p-3 rounded-xl text-sm font-bold border text-left flex items-center justify-between ${viajeActivo.estado === 'PACIENTE_A_BORDO' ? 'bg-[#34B37B] text-white' : 'bg-white text-slate-700 border-slate-300'}`}>
                          <span>3. Paciente a bordo - Hacia centro</span> <Icon name="chevron-right" className="w-4 h-4" />
                        </button>
                        <button onClick={() => handleCambiarEstadoChofer('FINALIZADO')} className={`p-3 rounded-xl text-sm font-bold border text-left flex items-center justify-between ${viajeActivo.estado === 'FINALIZADO' ? 'bg-[#123658] text-white' : 'bg-white text-slate-700 border-slate-300'}`}>
                          <span>4. Llegada a destino (Solicitar Firma)</span> <Icon name="file-signature" className="w-4 h-4" />
                        </button>
                      </div>

                      <div className="pt-3 border-t border-slate-100">
                        <PadFirmaDigital firmaExistente={viajeActivo.firmaUrl} onGuardarFirma={handleGuardarFirmaDigital} />
                      </div>
                    </div>
                  </div>
                )}

                {rolActivo === 'PACIENTE' && viajeActivo && (
                  <div className="max-w-2xl mx-auto space-y-5">
                    <div className="bg-white/95 backdrop-blur-md rounded-3xl border border-[#288296]/30 shadow-xl overflow-hidden">
                      <div className="text-white p-5" style={{ background: 'linear-gradient(135deg, #1B4D7E 0%, #24788F 55%, #34B37B 100%)' }}>
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-xs font-bold uppercase tracking-wider bg-white/15 px-3 py-1 rounded-full">Seguimiento en Vivo • {viajeActivo.aseguradoraArt}</span>
                          {viajeActivo.estado !== 'FINALIZADO' && (
                            <div className="text-right">
                              <span className="text-xs text-slate-100 block">Llegada estimada</span>
                              <span className="text-xl font-extrabold text-[#A7F3D0]">{viajeActivo.etaMinutos === 0 ? '¡En puerta!' : `${viajeActivo.etaMinutos} min`}</span>
                            </div>
                          )}
                        </div>
                        <h2 className="text-xl sm:text-2xl font-bold">{ESTADOS_VIAJE[viajeActivo.estado]?.label}</h2>
                        <p className="text-xs text-slate-100 mt-1">Paciente: <strong>{viajeActivo.pacienteNombre}</strong> • Siniestro {viajeActivo.numeroSiniestro}</p>
                        <div className="w-full bg-black/25 h-2 rounded-full mt-4 overflow-hidden">
                          <div className="bg-white h-full transition-all duration-700" style={{ width: `${viajeActivo.progreso || 5}%` }} />
                        </div>
                      </div>

                      <div className="p-4 bg-[#F2F7FA]">
                        <MapaSanRafael viaje={viajeActivo} isSimulating={simulandoGPS} />
                      </div>

                      <div className="p-5 border-t border-slate-100">
                        <span className="text-xs font-bold text-[#288296] uppercase tracking-wider block mb-3">Unidad y Chofer Asignado por Erquenci</span>
                        <div className="flex items-center justify-between bg-[#F2F7FA] p-4 rounded-2xl border border-[#288296]/20">
                          <div className="flex items-center gap-3.5">
                            <div className="w-14 h-14 rounded-2xl text-white flex items-center justify-center font-bold text-xl" style={{ background: 'linear-gradient(135deg, #34B37B 0%, #1B4D7E 100%)' }}>
                              {viajeActivo.choferFoto || 'ER'}
                            </div>
                            <div>
                              <h3 className="font-bold text-[#1B4D7E] text-base">{viajeActivo.choferNombre}</h3>
                              <p className="text-sm text-slate-600 font-medium">{viajeActivo.vehiculoModelo}</p>
                              <div className="mt-1 inline-block bg-white border border-slate-300 px-2.5 py-0.5 rounded-md font-mono text-xs font-bold text-[#1B4D7E]">{viajeActivo.vehiculoPatente}</div>
                            </div>
                          </div>
                          <a href={`tel:${viajeActivo.choferTelefono}`} className="w-11 h-11 rounded-full bg-[#34B37B] text-white flex items-center justify-center shadow-md">
                            <Icon name="phone" className="w-5 h-5" />
                          </a>
                        </div>

                        {viajeActivo.firmaUrl && (
                          <div className="mt-6 bg-[#E6F4F1] border border-[#34B37B]/40 rounded-2xl p-4">
                            <span className="text-sm font-bold text-[#1B4D7E] block mb-2">Comprobante Digital de Traslado ART Validado</span>
                            <div className="bg-white rounded-xl p-3 border border-[#34B37B]/25 flex flex-col items-center">
                              <img src={viajeActivo.firmaUrl} alt="Firma del paciente" className="h-20 object-contain" />
                              <span className="text-[11px] text-slate-400 mt-1">Erquenci: Tu salud en buenas manos • San Rafael, Mendoza</span>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}
              </>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
